
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomangix - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-BTvx5X4a.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-UYToua82.css">
</head>
<body>
    <div id="splash" class="splash">
        <canvas id="splash-lottie-bg" class="splash__lottie splash__lottie--bg" aria-hidden="true"></canvas>
        <canvas id="splash-lottie-music" class="splash__lottie splash__lottie--music" aria-hidden="true"></canvas>

        <div class="splash__card">
            <canvas id="splash-lottie-hero" class="splash__lottie splash__lottie--hero" aria-hidden="true"></canvas>
            <p class="splash__title">Roomangix Portfolio Showcase 2025</p>
            <p class="splash__subtitle">Click start to begin</p>
            <div class="splash__start-wrap">
                <canvas id="splash-lottie-click" class="splash__lottie splash__lottie--click" aria-hidden="true"></canvas>
                <button id="splash-enter" type="button" class="splash__start">START</button>
            </div>
        </div>
        <div class="splash__footer">
            <button id="splash-enter-silent" type="button" class="splash__silent">enter without sound :(</button>
            <p class="splash__hint splash__hint--desktop">use left/right click and mouse wheel to navigate!</p>
            <p class="splash__hint splash__hint--mobile">use one or two fingers to navigate!</p>
        </div>
    </div>

    <button
        id="music-toggle"
        type="button"
        class="music-toggle"
        hidden
        aria-label="Play music"
        aria-pressed="false"
    >
        <svg class="music-toggle__icon music-toggle__icon--on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M18.5 6a7.5 7.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="music-toggle__icon music-toggle__icon--off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M16 8.5l5 7.5M21 8.5l-5 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </button>

    <canvas class="webgl"></canvas>

</body>

</html>
